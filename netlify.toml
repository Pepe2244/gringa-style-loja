# Configuração de cache para otimizar a entrega de imagens do Next.js
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagens/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://www.gringastylebr.com.br/*"
  to = "https://gringastylebr.com.br/:splat"
  status = 301
  force = true

